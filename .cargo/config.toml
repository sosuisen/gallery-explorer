# rust-lld links faster than the default linker. It is part of the Rust toolchain.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"

# `cargo cov` measures the test coverage with cargo-llvm-cov. It prints a table per file.
# `cargo cov --html` writes a browsable report to target/llvm-cov/html/.
#
# The alias is a string, not an array. Worktrees live under .claude/worktrees/ inside the main
# checkout, so cargo reads this file twice. Cargo joins arrays from both files, and the joined
# alias fails with "unrecognized subcommand llvm-cov". A string from the nearer file wins.
# The regex has no spaces, so cargo can split the string on spaces.
#
# The numbers are not a target: the report is read for the lines no test reaches, which are
# either removed or given a test of the behaviour that needs them.
#
# These files are left out of the measurement since 2026-11-18, because no ordinary test can
# run them: they need a WinUI window or start another program.
# - src/main.rs: the entry point, which starts the WinUI app
# - src/ui.rs: the window, which builds WinUI controls and handles their events
# - src/infra/shell.rs: the call that opens a file with its default app
# - src/infra/shell_thumbnail.rs (since 2026-11-18): the calls that ask the Windows shell for a
#   thumbnail. The result depends on the thumbnail handlers installed on the machine.
# cargo-mutants skips the same files; see .cargo/mutants.toml.
[alias]
cov = 'llvm-cov --ignore-filename-regex src[/\\](main|ui|infra[/\\]shell|infra[/\\]shell_thumbnail)\.rs$'
