# Mutants that loop forever run until the timeout, so the timeout is kept short.
timeout_multiplier = 2.0

# These files have no tests, because they need a WinUI window, start another program, ask the
# Windows shell for a thumbnail, or set the icon of the window.
# cargo-llvm-cov skips the same files; see .cargo/config.toml.
exclude_globs = [
    "src/main.rs",
    "src/ui.rs",
    "src/infra/shell.rs",
    "src/infra/shell_thumbnail.rs",
    "src/infra/app_icon.rs",
]
