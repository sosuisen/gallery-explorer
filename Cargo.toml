[package]
name = "gallery-explorer"
version = "0.1.0"
edition = "2024"

[dependencies]
notify = "8.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
windows-reactor = "0.100"

[dev-dependencies]
tempfile = "3.27.0"

# Less debug information makes the link step faster. A panic still shows the file and line.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[build-dependencies]
winresource = "0.1.34"
